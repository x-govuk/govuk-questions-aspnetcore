name: "Build & release"

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
    paths-ignore:
      - LICENSE
      - "**.md"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - LICENSE
      - "**.md"

jobs:
  build:
    name: "Build library"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-configuration: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # required for minver to create the right version number
          filter: tree:0

      - uses: jdx/mise-action@v3

      - name: Restore
        run: just restore

      - name: Format
        run: just format --verify-no-changes

      - name: Build
        run: just build --configuration ${{ matrix.build-configuration }}

      - name: Test
        run: just test --configuration ${{ matrix.build-configuration }}

      - name: Assign package build metadata
        if: startsWith(github.ref, 'refs/tags/v') != true
        run: |
          echo "MINVERBUILDMETADATA=build.${{ github.run_id }}.${{ github.run_attempt}}" >> $GITHUB_ENV

      - name: Pack
        if: matrix.build-configuration == 'Release'
        run: just pack --configuration ${{ matrix.build-configuration }}

      - name: Publish package artifact
        if: matrix.build-configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: Packages
          path: |
            packages/*.nupkg
            packages/*.snupkg

  release:
    name: "Publish packages to NuGet"
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3

      - name: Download package artifact
        uses: actions/download-artifact@v6
        with:
          name: Packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to NuGet
        run: dotnet nuget push **/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
